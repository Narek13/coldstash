# Mount the plugin repo (this folder) into the DDEV-managed WordPress install
# as a plugin, read-only. WP core lives in .ddev/wordpress (gitignored); the
# plugin source is this repo root, so there's no symlink recursion.
services:
  web:
    volumes:
      - ../:/var/www/html/.ddev/wordpress/wp-content/plugins/${DDEV_PROJECT}:ro
