name: PHP Quality Assurance

on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - '**.php'
      - 'composer.*'
      - 'phpcs.*'
      - 'phpstan.*'
      - 'readme.txt'
      - '.distignore'
      - 'bin/build-zip.sh'
      - '.github/workflows/php-qa.yml'

jobs:
  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3', '8.4' ]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Validate composer.json
        run: composer validate --strict
      - name: PHP syntax check
        run: |
          find ./src ./tests ./bin ./templates ./coldstash.php ./uninstall.php -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

  coding-standards:
    name: PHP_CodeSniffer (WooCommerce-Core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: cs2pr
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Run PHPCS
        run: ./vendor/bin/phpcs -q --report=checkstyle | cs2pr

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Run PHPStan
        run: composer phpstan

  smoke:
    name: Smoke test (no WordPress)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Run the standalone smoke test
        run: php bin/smoke-test.php

  plugin-check:
    name: Plugin Check (release package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the release package
        run: bash bin/build-zip.sh
      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: dist/coldstash
          slug: coldstash
